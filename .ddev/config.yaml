name: mbox
type: php
docroot: ""
no_project_mount: true
php_version: "8.2"
composer_version: "2"
webserver_type: apache-fpm
router_http_port: "80"
router_https_port: "443"
xdebug_enabled: false
additional_hostnames:
    - v12.mbox
    - v13.mbox
    - v14.mbox
additional_fqdns: []
database:
    type: mariadb
    version: "10.4"
# Mutagen has no project mount to optimize here (no_project_mount: true), so disable it.
performance_mode: none
use_dns_when_possible: true
